# ==============================================================================
# Codex Configuration Template (Sanitized Example)
# Path: ~/.codex/config.toml or <profile>.config.toml
# ==============================================================================

# Use the runtime/account default model unless you have verified an exact model ID.
model_reasoning_effort = "medium"

# Approval and Sandbox Policy
# Options: "on-request" (recommended for interactive work), "never" (for CI/automated test runs)
approval_policy = "on-request"
sandbox_mode = "workspace-write"
allow_login_shell = false

[features]
hooks = true
multi_agent = true

[sandbox_workspace_write]
network_access = false          # Set to true only when package installation or web tests are needed
exclude_tmpdir_env_var = false
exclude_slash_tmp = false
# Add local virtualenv or package caches if needed:
# writable_roots = ["/path/to/project/.venv"]

# Shell Environment Policy: Protect host credentials from leaking into subshells
[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false

[shell_environment_policy.filters]
"AWS_*" = "exclude"
"AZURE_*" = "exclude"
"GITHUB_TOKEN" = "exclude"
"*KEY*" = "exclude"
"*SECRET*" = "exclude"

# Instruction discovery limits
project_doc_fallback_filenames = ["TEAM_GUIDE.md", ".agents.md"]
project_doc_max_bytes = 32768

# Subagent Configuration
[agents]
enabled = true
# default_subagent_model = "YOUR_AVAILABLE_FAST_MODEL"
max_concurrent_threads_per_session = 3
interrupt_message = true

[agents.reviewer]
description = "Independent senior code review for correctness, security, edge cases, and maintainability."

[agents.explorer]
description = "Fast read-only codebase exploration and citation gathering."

[agents.tester]
description = "Independent test execution, failure reproduction, and verification."

# Model Context Protocol (MCP) Servers
[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
enabled = true
default_tools_approval_mode = "auto"

# Optional Custom Provider Example (e.g. LLM Proxy or Self-Hosted Endpoint)
# [model_providers.custom_proxy]
# name = "Internal Gateway"
# base_url = "https://llm-gateway.example.com/v1"
# env_key = "OPENAI_API_KEY"
# wire_api = "responses"

# Analytics (optional)
[analytics]
enabled = false
